# Fleet configuration. Read by agents/scripts/flo.
# Sized to real plan limits as of 2026-08-24. Update caps here, never in prose.

version: 1

policy:
  max_stories_in_flight: 6      # 21 Oct 2026: 4 -> 6, review-bound lanes left both Claude accounts idle (see project-memory); 10 Oct: parallel trains, one test DB per worktree
  min_reviewers: 1              # one review per story, scaled to risk (below)
  release_reviewers: [qwen, deepseek]   # second and third pass on the whole milestone
                                        # diff, before the PR to main — not per story
  max_review_rounds: 3          # then flo escalate → opus arbitration
  # 10 Oct 2026, operator-approved: a story carrying one of these tags is reviewed by Opus
  # alone, as before. Every other story (crud, plain ui, docs) is reviewed by the first
  # ungated reviewer with budget left, and Opus reviews the whole train's diff instead.
  # `ui` left this list deliberately: MASTER-token and a11y checks are mechanical and run
  # in flo check; Opus's UI pass moves to the train diff.
  opus_final_required_tags: [money, auth, security, migration, concurrency]
  # 13 Oct 2026, operator-approved: Sonnet authors, Codex reviews every story (gated ones also
  # get a fresh Opus session), qwen then deepseek review whatever Codex authored or cannot reach.
  # 11 Oct 2026: kimi left this list at 0.0 findings in 2 reviews; deepseek 1.0 in 6.
  ungated_reviewers: [opus, codex, qwen, deepseek]  # 24 Oct 2026 operator: Opus until Codex's window resets; then restore [codex, qwen, deepseek]
  # 23 Oct 2026, operator: Sonnet authors every non-overridden story on account A or B.
  # When both accounts have no worker slot, the story waits; there is no overflow author.
  # A milestone sole_author override (M0 below) remains authoritative.
  author_priority: [sonnet]

# Per-milestone overrides. A milestone may concentrate authorship on one agent when
# the cost of getting it wrong is a rewrite rather than a patch. Reviewers are NOT
# reduced by an override: review is cheap insurance and the free pool is unmetered.
milestone_overrides:

  M0:
    reason: >
      Foundations. 22 of 24 M0 stories are already tagged money/auth/security/
      migration/ui/concurrency. Tenancy, RLS, money primitives, audit, idempotency
      and sessions are not defects you patch later - getting them wrong is a rewrite
      or a breach. Authorship is concentrated on the strongest coding agent and every
      story takes an Opus final review, including the two that are not otherwise gated.
    sole_author: codex
    # Reviewers widened on 24 Aug 2026. opencode-nemotron returned approve with ZERO
    # findings on its first three reviews (scorecard: findings_per_review 0.0) while
    # Opus found six real defects in those same stories - a committed task packet in
    # two of them, world-bound ports with repo-published credentials, root credentials
    # in a healthcheck, an unauthenticated /readyz DoS path, and a tag-pinned base
    # image. That is the rubber-stamping pattern AGENTS.md 2.3b calls a fleet defect.
    # M0's remaining stories are money, tenancy and security foundations, so they now
    # carry three independent reviewers plus the Opus final.
    # 24 Aug 2026, second routing change, now with a real sample. Across six M0
    # reviews opencode-nemotron returned approve with 0.0 findings every time - on
    # the same stories where qwen raised three majors and a blocker and deepseek
    # raised two findings, including a non-ISO currency code accepted as money and
    # a float ban that missed '-> float'. It is not malfunctioning; it is a cheap
    # model doing a shallow pass. Gated M0 stories therefore carry three independent
    # reviewers plus the Opus final, and nemotron keeps ungated work where a shallow
    # pass is adequate.
    # 25 Aug 2026, third routing change. qwen is replaced by kimi. On E01-S05 qwen
    # failed four consecutive review runs without ever producing a verdict: two died
    # on sandbox permission rejections mid-experiment, one on a repeat of the same,
    # and the fourth ran fourteen minutes emitting zero output. Its partial passes
    # were sound - it withdrew a failure() hypothesis after research and dismissed a
    # preview-only ruff rule - so this is an operational reliability change, not a
    # judgement on review quality. A reviewer that cannot finish cannot count toward
    # the two-reviewer floor.
    # 25 Aug 2026, fourth routing change. qwen returns, kimi leaves the gated slot.
    # Both ran on E04-S01 to settle the open question. qwen planted twelve violations,
    # cross-checked the test's OKLCH-to-sRGB engine against its own implementation, and
    # raised the only real blocker in the story - the money-direction tokens passed by
    # absence, and deleting all three left the suite green. kimi approved with zero
    # findings, its second clean-room story running at 0.0 findings per review. The
    # four failures that cost qwen this slot were all caused by the review packet
    # (dotfile reads, /tmp writes, a 1,108-line lockfile) and are fixed; qwen has now
    # completed two consecutive runs. Scorecard: qwen 2.4 findings/review, kimi 0.0.
    # 25 Aug 2026, fifth routing change, operator decision. Per-story review is Opus
    # alone; qwen and deepseek move to release review, where they read the whole
    # milestone diff before the PR to main. Rationale: codex authors M0 end to end and
    # a two-reviewer round trip per story dominated the cycle time. The fleet-wide
    # independent check is not removed — it moves from 25 story-sized passes to one
    # milestone-sized pass, which is also where cross-story drift is visible at all.
    reviewers: [opus]
    opus_final_all: true
    cost: >
      The operator holds Codex usage resets, so the weekly cap is not the binding
      constraint on M0 and all 24 stories stay with Codex. Reviewers are unchanged:
      Opus plus one unmetered OpenCode agent on every story. Review is the cheapest
      insurance in the fleet and concentrating authorship is not a reason to thin it.

agents:

  opus:
    model: claude-opus-5
    cli: claude
    plan: pro
    metered: rate                # scarcest capacity in the fleet
    cost_per_story: high
    roles: [design, final_review, arbitration, milestone_review]
    allowed_kinds: []            # authors nothing routine — see agents/claude.md
    fallback: []                 # no substitute; if unavailable, gated stories wait
    notes: >
      Claude Pro. Batch design per milestone. Final review only on gated stories.
      Never spend tokens reconstructing context flo already wrote into task.json.

  sonnet:
    model: sonnet                # claude CLI alias, resolves to the current Sonnet
    reasoning: medium            # operator decision 13 Oct 2026 (5ba2460); passed as --effort
    cli: "claude -p --model sonnet"
    plan: claude-pro (two accounts)
    metered: rate
    # Two Claude Pro accounts. Every Claude session on an account (planner, reviewer, workers)
    # draws the same usage window. `default` means CLAUDE_CONFIG_DIR unset (`claude-personal`):
    # exporting it as ~/.claude is a different, logged-out login, because the keychain entry
    # follows the variable, not the folder.
    accounts:
      A: default                 # claude / claude-personal
      B: ~/.claude-summello      # claude-summello
    max_workers_per_account: 2   # 13 Oct 2026: raised from the pilot's 1 when the operator handed B four stories (B at 8% used).
                                 # Drop an account back to 1 if it caps more than once a day.
    roles: [author]
    allowed_kinds: [ledger, concurrency, migration, security, engine, api, chore, ui, crud, docs, test]
    fallback: []
    notes: >
      13 Oct 2026: primary author, one session per story with a pre-assigned id
      (flo account), resumed for review rounds and red story CI. Skill: xlr8flo-worker.

  codex:
    model: gpt-5.6-sol            # operator-supplied; verify the exact --model string
    reasoning: high               # the CLI flag, not a hint
    review_reasoning: medium      # 13 Oct 2026: reviews pin model and effort on the command
                                  # line; ~/.codex/config.toml silently ran `low` on 12 Oct
    cli: "codex exec"
    plan: chatgpt-plus
    metered: rate
    weekly_story_budget: 18      # operator holds usage resets; the cap is not the
                                 # constraint it was. Still bounded so a runaway
                                 # loop cannot burn every reset in one night.
    roles: [review]
    # M0 needs api/chore/ui too, because the M0 override makes codex sole author.
    allowed_kinds: [ledger, concurrency, migration, security, engine, api, chore, ui, crud]  # crud only reaches codex when a free author avoids its tags
    prefer_tags: [money, concurrency, migration, security]
    fallback: []
    notes: >
      ChatGPT Plus weekly cap is tight. Outside a milestone override, review only.
      Operator exception, 23 Oct 2026: the Codex planner may take over an E23-S14..S18
      implementation only after its assigned Sonnet actually exhausts capacity; record
      that substitution explicitly before authoring.

  opencode-nemotron:
    model: nvidia/nemotron-3-ultra-550b-a55b:free      # via OpenRouter, not OpenCode Zen
    cli: "opencode run --model openrouter/nvidia/nemotron-3-ultra-550b-a55b:free"
    plan: openrouter-credits
    metered: none                # :free variant — no credit drawdown
    roles: []                    # 23 Oct 2026, operator: no story authorship
    allowed_kinds: []
    avoid_tags: [money, auth, security, migration, concurrency]   # gated stories → codex
    max_author_size: S           # 23 Oct 2026: S only. 10 Oct 2026: E06-S07 (ui, L) ended exit 0 with nothing committed,
                                 # no tests and an out-of-scope identity edit; L stories → codex
    fallback: []
    notes: >
      10 Oct 2026: second parallel author lane, operator-approved. Takes the crud, ui and
      docs lanes so codex's cap stays on the money, engine and security trains. Evidence:
      9 of 9 authored stories merged clean in one round (SCORECARD.md, author score 100.0).
      Its reviewer record (0.0 findings per review) is why it reviews nothing here.
      Default author. 25 Aug 2026: moved off OpenCode Zen's `nemotron-ultra`, which
      began failing every request with "Unexpected server error" — a bare one-word
      prompt failed identically, so the endpoint, not the model, was gone. That was
      the second Zen endpoint withdrawn after ox-alpha. Everything now runs through
      OpenRouter, where the operator holds actual credits and a `:free` variant can
      degrade to the paid one instead of vanishing.

  opencode-ox:
    model: stealth/ox-alpha                            # via OpenRouter, not OpenCode Zen
    cli: "opencode run --model openrouter/stealth/ox-alpha"
    plan: openrouter-credits
    metered: none                # second free model — the reason Codex is not spent on reviews
    roles: [review]              # 10 Oct 2026: endpoint withdrawn before; never routed as author
    allowed_kinds: [crud, ui, api, chore, docs, test]
    avoid_tags: [money, auth, security, migration, concurrency]
    fallback: [opencode-nemotron, qwen]
    notes: >
      Distinct model from nemotron-ultra, so a free author still gets a free,
      independent reviewer. Keep them assigned to different sides of a story.

  qwen:
    model: qwen/qwen3.8-27b                      # OpenRouter; reinstated on E04-S01
    cli: "opencode run --model openrouter/qwen/qwen3.8-27b"        # primary reviewer
    # Same auth gotcha as kimi below — run it with an isolated XDG_DATA_HOME.
    plan: openrouter-credits
    metered: spend
    monthly_budget_usd: 20       # hard cap; flo budget refuses assignment past it
    reserve_for_review_usd: 12   # review capacity is protected from authoring spend
    roles: [review]
    allowed_kinds: [crud, ui, docs, chore, test]
    max_author_size: S           # authors small stories only
    fallback: [deepseek, kimi]
    notes: >
      Costs materially more per review than kimi and earns it. On E04-S01 it planted
      twelve violations, verified the test's colour engine against its own
      implementation, and found the one blocker two other reviewers missed. Its earlier
      four failed runs were caused by the review packet, not the model.

  kimi:
    model: moonshotai/kimi-k2.6                  # OpenRouter; held as qwen's fallback
    cli: "opencode run --model openrouter/moonshotai/kimi-k2.6"    # after E04-S01
    # Gotcha: opencode's SAVED OpenRouter credential is stale and shadows the environment
    # key, so plain `opencode run -m openrouter/...` fails with `Error: User not found`
    # even though the keychain key is valid. Run it with an isolated auth store instead:
    #   XDG_DATA_HOME=<scratch> OPENROUTER_API_KEY=$(security find-generic-password \
    #     -a "$USER" -s OPENROUTER_API_KEY -w) opencode run -m openrouter/...
    # No secret is written to disk. OpenCode Zen's non-free models require a payment
    # method, so the *-free models are the only Zen options.
    plan: openrouter-credits
    metered: spend
    monthly_budget_usd: 20       # hard cap; flo budget refuses assignment past it
    reserve_for_review_usd: 12   # review capacity is protected from authoring spend
    roles: [review]
    allowed_kinds: [crud, ui, docs, chore, test]
    max_author_size: S           # authors small stories only
    fallback: [deepseek, qwen]

  deepseek:
    model: deepseek/deepseek-v4-pro-0813         # OpenRouter; qwen's review fallback
    cli: "opencode run --model openrouter/deepseek/deepseek-v4-pro-0813"
    plan: openrouter-credits
    metered: spend
    monthly_budget_usd: 20       # 11 Oct 2026: now a primary ungated reviewer, so it gets a cap
    reserve_for_review_usd: 20
    roles: [review]              # review only - authoring stays with codex for M0
    allowed_kinds: []
    fallback: [qwen, kimi]
    notes: >
      Second independent reviewer. Exists because opencode-ox's ox-alpha endpoint was
      withdrawn, leaving the free pool at one model and no independent check on it.

# Assignment algorithm (implemented in flo assign — this is the spec, not a suggestion):
#   0. if a milestone_override applies to the story's milestone, its sole_author and
#      reviewers win outright; opus_final_all forces a final review on every story.
#   1. candidates = agents where story.kind in allowed_kinds
#                   and (size <= max_author_size or unset)
#                   and has remaining capacity
#   2. author  = candidate with the lowest scarcity, preferring prefer_tags matches
#   2a. if policy.author_priority is set, author = its first entry that is a candidate
#       (an agent with accounts is a candidate only while one has a free worker slot)
#   3. opus_final = story.tags ∩ policy.opus_final_required_tags is non-empty
#      reviewers = the first of policy.ungated_reviewers that is not the author;
#      opus_final adds a fresh Opus review on top (13 Oct 2026)
#                  that is not the author and is under its monthly budget
#   4. if fewer than min_reviewers are reachable → story waits, never merges short
#   5. an ungated story's code is still read by Opus, once, in its train's diff
#   6. every substitution is recorded in the task packet
