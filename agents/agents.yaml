# Fleet configuration. Read by agents/scripts/flo.
# Sized to real plan limits as of 2026-08-24. Update caps here, never in prose.

version: 1

policy:
  max_stories_in_flight: 3      # two reviewers per story saturates the fleet at 3
  min_reviewers: 2              # a story never merges on one review
  max_review_rounds: 3          # then flo escalate → opus arbitration
  free_reviewer_pool: [opencode-nemotron, opencode-ox]  # at least one reviewer must come from here,
                                                        # so a rationed agent is never the merge blocker
  opus_final_required_tags: [money, auth, security, migration, ui, concurrency]

# Per-milestone overrides. A milestone may concentrate authorship on one agent when
# the cost of getting it wrong is a rewrite rather than a patch. Reviewers are NOT
# reduced by an override: review is cheap insurance and the free pool is unmetered.
milestone_overrides:

  M0:
    reason: >
      Foundations. 22 of 24 M0 stories are already tagged money/auth/security/
      migration/ui/concurrency. Tenancy, RLS, money primitives, audit, idempotency
      and sessions are not defects you patch later - getting them wrong is a rewrite
      or a breach. Authorship is concentrated on the strongest coding agent and every
      story takes an Opus final review, including the two that are not otherwise gated.
    sole_author: codex
    # Reviewers widened on 24 Aug 2026. opencode-nemotron returned approve with ZERO
    # findings on its first three reviews (scorecard: findings_per_review 0.0) while
    # Opus found six real defects in those same stories - a committed task packet in
    # two of them, world-bound ports with repo-published credentials, root credentials
    # in a healthcheck, an unauthenticated /readyz DoS path, and a tag-pinned base
    # image. That is the rubber-stamping pattern AGENTS.md 2.3b calls a fleet defect.
    # M0's remaining stories are money, tenancy and security foundations, so they now
    # carry three independent reviewers plus the Opus final.
    # 24 Aug 2026, second routing change, now with a real sample. Across six M0
    # reviews opencode-nemotron returned approve with 0.0 findings every time - on
    # the same stories where qwen raised three majors and a blocker and deepseek
    # raised two findings, including a non-ISO currency code accepted as money and
    # a float ban that missed '-> float'. It is not malfunctioning; it is a cheap
    # model doing a shallow pass. Gated M0 stories therefore carry three independent
    # reviewers plus the Opus final, and nemotron keeps ungated work where a shallow
    # pass is adequate.
    # 25 Aug 2026, third routing change. qwen is replaced by kimi. On E01-S05 qwen
    # failed four consecutive review runs without ever producing a verdict: two died
    # on sandbox permission rejections mid-experiment, one on a repeat of the same,
    # and the fourth ran fourteen minutes emitting zero output. Its partial passes
    # were sound - it withdrew a failure() hypothesis after research and dismissed a
    # preview-only ruff rule - so this is an operational reliability change, not a
    # judgement on review quality. A reviewer that cannot finish cannot count toward
    # the two-reviewer floor.
    reviewers: [opus, kimi, deepseek]
    opus_final_all: true
    cost: >
      The operator holds Codex usage resets, so the weekly cap is not the binding
      constraint on M0 and all 24 stories stay with Codex. Reviewers are unchanged:
      Opus plus one unmetered OpenCode agent on every story. Review is the cheapest
      insurance in the fleet and concentrating authorship is not a reason to thin it.

agents:

  opus:
    model: claude-opus-5
    cli: claude
    plan: pro
    metered: rate                # scarcest capacity in the fleet
    cost_per_story: high
    roles: [design, final_review, arbitration, milestone_review]
    allowed_kinds: []            # authors nothing routine — see agents/claude.md
    fallback: []                 # no substitute; if unavailable, gated stories wait
    notes: >
      Claude Pro. Batch design per milestone. Final review only on gated stories.
      Never spend tokens reconstructing context flo already wrote into task.json.

  codex:
    model: gpt-5.6-sol            # operator-supplied; verify the exact --model string
    reasoning: high               # the CLI flag, not a hint
    cli: "codex exec"
    plan: chatgpt-plus
    metered: rate
    weekly_story_budget: 18      # operator holds usage resets; the cap is not the
                                 # constraint it was. Still bounded so a runaway
                                 # loop cannot burn every reset in one night.
    roles: [author, review]
    # M0 needs api/chore/ui too, because the M0 override makes codex sole author.
    allowed_kinds: [ledger, concurrency, migration, security, engine, api, chore, ui]
    prefer_tags: [money, concurrency, migration, security]
    fallback: [opencode-nemotron]
    notes: >
      ChatGPT Plus weekly cap is tight. Outside a milestone override, never assign
      CRUD, docs or styling - that capacity belongs on the ledger and the engines.

  opencode-nemotron:
    model: nvidia/nemotron-3-ultra-550b-a55b:free      # via OpenRouter, not OpenCode Zen
    cli: "opencode run --model openrouter/nvidia/nemotron-3-ultra-550b-a55b:free"
    plan: openrouter-credits
    metered: none                # :free variant — no credit drawdown
    roles: [author, review]
    allowed_kinds: [crud, ui, api, chore, docs, engine, migration, test]
    fallback: [opencode-ox, kimi, codex]
    notes: >
      Default author. 25 Aug 2026: moved off OpenCode Zen's `nemotron-ultra`, which
      began failing every request with "Unexpected server error" — a bare one-word
      prompt failed identically, so the endpoint, not the model, was gone. That was
      the second Zen endpoint withdrawn after ox-alpha. Everything now runs through
      OpenRouter, where the operator holds actual credits and a `:free` variant can
      degrade to the paid one instead of vanishing.

  opencode-ox:
    model: stealth/ox-alpha                            # via OpenRouter, not OpenCode Zen
    cli: "opencode run --model openrouter/stealth/ox-alpha"
    plan: openrouter-credits
    metered: none                # second free model — the reason Codex is not spent on reviews
    roles: [author, review]
    allowed_kinds: [crud, ui, api, chore, docs, engine, test]
    fallback: [opencode-nemotron, kimi]
    notes: >
      Distinct model from nemotron-ultra, so a free author still gets a free,
      independent reviewer. Keep them assigned to different sides of a story.

  kimi:
    model: moonshotai/kimi-k2.6                  # OpenRouter; replaced qwen as the
    cli: "opencode run --model openrouter/moonshotai/kimi-k2.6"   # primary reviewer
    # Gotcha: opencode's SAVED OpenRouter credential is stale and shadows the environment
    # key, so plain `opencode run -m openrouter/...` fails with `Error: User not found`
    # even though the keychain key is valid. Run it with an isolated auth store instead:
    #   XDG_DATA_HOME=<scratch> OPENROUTER_API_KEY=$(security find-generic-password \
    #     -a "$USER" -s OPENROUTER_API_KEY -w) opencode run -m openrouter/...
    # No secret is written to disk. OpenCode Zen's non-free models require a payment
    # method, so the *-free models are the only Zen options.
    plan: openrouter-credits
    metered: spend
    monthly_budget_usd: 20       # hard cap; flo budget refuses assignment past it
    reserve_for_review_usd: 12   # review capacity is protected from authoring spend
    roles: [author, review]
    allowed_kinds: [crud, ui, docs, chore, test]
    max_author_size: S           # authors small stories only
    fallback: [deepseek]

  deepseek:
    model: deepseek/deepseek-v4-pro-0813         # OpenRouter; kimi's review fallback
    cli: "opencode run --model openrouter/deepseek/deepseek-v4-pro-0813"
    plan: openrouter-credits
    metered: spend
    roles: [review]              # review only - authoring stays with codex for M0
    allowed_kinds: []
    fallback: [kimi]
    notes: >
      Second independent reviewer. Exists because opencode-ox's ox-alpha endpoint was
      withdrawn, leaving the free pool at one model and no independent check on it.

# Assignment algorithm (implemented in flo assign — this is the spec, not a suggestion):
#   0. if a milestone_override applies to the story's milestone, its sole_author and
#      reviewers win outright; opus_final_all forces a final review on every story.
#   1. candidates = agents where story.kind in allowed_kinds
#                   and (size <= max_author_size or unset)
#                   and has remaining capacity
#   2. author  = candidate with the lowest scarcity, preferring prefer_tags matches
#   3. reviewers = 2 agents != author, at least one from policy.free_reviewer_pool
#   4. if fewer than min_reviewers are reachable → story waits, never merges short
#   5. opus_final required if story.tags ∩ policy.opus_final_required_tags
#   6. every substitution is recorded in the task packet
