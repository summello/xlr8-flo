version: 1
generated_note: 154 stories across 6 milestones. Order is dependency order.

milestones:
  - id: M0
    name: Rails
    branch: milestone/M0-rails
    goal: A deployed, empty, production-shaped application. No business value,
      everything the business logic stands on.
  - id: M1
    name: Budget spine
    branch: milestone/M1-budget-spine
    goal: The trustworthy system of record. Projects, hierarchy and the complete
      budget ledger.
  - id: M2
    name: Governed demand
    branch: milestone/M2-governed-demand
    goal: Requisitions that reserve real money, and the approval engine that
      authorizes them.
  - id: M3
    name: First sellable release
    branch: milestone/M3-sellable
    goal: Vendors, RFQs, awards and purchase orders by email. Closes the money loop
      end to end.
  - id: M4
    name: Full Phase-1 scope
    branch: milestone/M4-phase1-complete
    goal: Assets, reporting, custom fields, search and notifications. Completes
      requirements.md Phase 1.
  - id: M5
    name: Customer-ready
    branch: milestone/M5-customer-ready
    goal: Self-serve tenancy, verification, backup evidence, legal surface,
      graduation instrumentation.

