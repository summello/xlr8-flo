<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Approval Workflows, 1920</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="xlr8flo.css">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<dc-import name="ApprovalWorkflows" theme="{{theme}}" collapsed="no" hint-size="100%,900px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"dark","options":["light","dark"]},"$preview":{"width":1920,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return { theme: this.props.theme ?? 'light' }; }
}
</script>
</body>
</html>
