# CodeQL configuration for SEC-012.
#
# The workflow runs `security-and-quality`, which is worth keeping: the quality
# pack catches real maintainability defects the security pack does not. One of
# its queries does not survive contact with this codebase.
name: xlr8flo

# The design canvas is reference material, not product code: ~120 board files of
# inline demo script plus Playwright specs that run only against those boards. It is
# not built, not deployed and not imported by apps/. Scanning it produced 282 alerts on
# the first M1 PR (280 js/useless-expression in the boards) and drowned the real
# findings in the app. Nothing under apps/, kernel or infra is excluded; if canvas
# code is ever promoted into apps/, it is scanned from that point.
paths-ignore:
  - design-system/canvas

query-filters:
  # py/ineffectual-statement flags the `...` body of every method on every
  # `typing.Protocol`. This is a ports-and-adapters codebase — `IdentityProvider`,
  # `IdentityConnection`, `RlsSession` and `MigrationConnection` already produce 18 of
  # these, and every future port produces more. The bug class the query
  # exists for (a bare expression written where a call was meant) is covered by
  # ruff B018, which exempts Ellipsis in stub bodies and is enforced by `flo check`.
  - exclude:
      id: py/ineffectual-statement
