name: xlr8flo

services:
  postgres:
    image: postgres:17@sha256:e38411452a464af89e5adadb8d223bf53b898d47d6ef918b2d58c08707350449
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flo-local}
      POSTGRES_DB: ${POSTGRES_DB:-flo_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/db-init.sql:/docker-entrypoint-initdb.d/10-create-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 5s
      retries: 30

  seaweedfs:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: server -dir=/data -s3 -s3.port=9000 -s3.autoCreateBucket=false
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-flo}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-flo-local-secret}
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9000"]
      interval: 2s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.31.0@sha256:c96991d9bef73594c246d89ca81411d4e916f03e76a7d2d72fa2ab5dd3c9ce24
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8025/readyz"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
  seaweedfs-data:
